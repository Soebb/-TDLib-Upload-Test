plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
}

android {
    namespace 'com.soebb.tdlibuploadtest'
    compileSdk 35
    defaultConfig {
        applicationId 'com.soebb.tdlibuploadtest'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-tdlib-bulk'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "yt-dlp==2026.11.23"
        }
    }
}
