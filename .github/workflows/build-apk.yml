name: TDLib Chaquopy Bulk Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - instagram-bulk-tdlib-chaquopy
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: tdlib-chaquopy-bulk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download and verify pinned TDLib Android build
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/codaki-apps/tdlib-android/releases/download/tdlib-1.8.70-c8828d5/tdlib-android-tdlib-1.8.70-c8828d5.zip"
          curl -fL "$URL" -o tdlib.zip
          echo "2afded561d458183fe71de7a5cca37efda4e8f3e1b246ac6b62020729d20da8b  tdlib.zip" | sha256sum -c -
          mkdir tdlib-dist
          unzip -q tdlib.zip -d tdlib-dist
          mkdir -p app/src/main/jniLibs app/src/main/java/org/drinkless/tdlib
          cp -R tdlib-dist/jniLibs/. app/src/main/jniLibs/
          cp -R tdlib-dist/java/org/drinkless/tdlib/. app/src/main/java/org/drinkless/tdlib/

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-chaquopy-bulk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish debug APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "Debug APK was not found."
            exit 1
          fi

          TAG="debug-build-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK - Build #${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})"

          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --notes "Automated debug APK built from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}." \
            --target "$GITHUB_SHA"
