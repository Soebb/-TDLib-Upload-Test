name: Build TDLib Bulk Downloader APK
on:
  push:
    branches: [ main, auth-delivery-diagnostics, instagram-bulk-tdlib-chaquopy ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download and verify pinned TDLib Android build
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/codaki-apps/tdlib-android/releases/download/tdlib-1.8.70-c8828d5/tdlib-android-tdlib-1.8.70-c8828d5.zip"
          curl -fL "$URL" -o tdlib.zip
          echo "2afded561d458183fe71de7a5cca37efda4e8f3e1b246ac6b62020729d20da8b  tdlib.zip" | sha256sum -c -
          mkdir tdlib-dist
          unzip -q tdlib.zip -d tdlib-dist
          mkdir -p app/src/main/jniLibs app/src/main/java/org/drinkless/tdlib
          cp -R tdlib-dist/jniLibs/. app/src/main/jniLibs/
          cp -R tdlib-dist/java/org/drinkless/tdlib/. app/src/main/java/org/drinkless/tdlib/
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TDLib-Bulk-Downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
